[project]
name = "sensorforge"
version = "0.1.0"
description = "Calibrate a MuJoCo simulated camera to match a real one via an agentic loop."
readme = "README.md"
requires-python = ">=3.11,<3.12"
authors = [{ name = "Ajay Kasu" }]
license = { text = "MIT" }
keywords = [
    "sim-to-real",
    "camera-calibration",
    "mujoco",
    "image-signal-processing",
    "robotics",
    "emva1288",
    "llm-agent",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "anthropic>=0.34,<1",
    "colour-science>=0.4,<0.5",
    "google-genai>=2.7.0",
    "langgraph>=0.2,<0.7",
    "loguru>=0.7,<0.8",
    "matplotlib>=3.8,<4",
    "mujoco>=3.1,<4",
    "numpy>=1.26,<3",
    "ollama>=0.3,<1",
    "openai>=1.40,<2",
    "opencv-python>=4.9,<5",
    "pydantic>=2.6,<3",
    "scikit-image>=0.22,<0.26",
    "streamlit>=1.38,<2",
]

[project.urls]
Homepage = "https://github.com/AjayKasu1/SensorForge"
Repository = "https://github.com/AjayKasu1/SensorForge"
Issues = "https://github.com/AjayKasu1/SensorForge/issues"

[project.scripts]
sensorforge = "sensorforge.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sensorforge"]

# Ship the calibration scenes as package data so an installed CLI can find them.
[tool.hatch.build.targets.wheel.force-include]
"scenes" = "sensorforge/scenes"

[dependency-groups]
dev = [
    "pytest>=8.0,<9.0",
    "ruff>=0.6,<0.13",
    "ipykernel>=6.29,<7",
    "nbconvert>=7,<8",
    "pytest-cov>=5,<8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
pythonpath = ["src"]
