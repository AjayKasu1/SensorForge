[project]
name = "sensorforge"
version = "0.0.1"
description = "Calibrate a MuJoCo simulated camera to match a real webcam via an LLM-driven loop."
readme = "README.md"
requires-python = ">=3.11,<3.12"
authors = [{ name = "Ajay Kasu" }]
license = { text = "MIT" }
# Runtime deps are added per phase as real imports appear.
dependencies = [
    "loguru>=0.7,<0.8",
    "matplotlib>=3.8,<4",
    "mujoco>=3.1,<4",
    "numpy>=1.26,<3",
    "opencv-python>=4.9,<5",
    "pydantic>=2.6,<3",
]

[project.scripts]
sensorforge = "sensorforge.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sensorforge"]

[dependency-groups]
dev = [
    "pytest>=8.0,<9.0",
    "ruff>=0.6,<0.13",
    "ipykernel>=6.29,<7",
    "nbconvert>=7,<8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
pythonpath = ["src"]
