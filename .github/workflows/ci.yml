name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # Headless software GL so MuJoCo can render offscreen on the runner.
      MUJOCO_GL: osmesa
      PYOPENGL_PLATFORM: osmesa
    steps:
      - uses: actions/checkout@v4

      - name: Install system libraries (headless GL, OpenCV)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libosmesa6-dev libgl1 libglib2.0-0 libglfw3 patchelf

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
          enable-cache: true

      - name: Sync dependencies
        run: uv sync

      - name: Lint and format check
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Tests with coverage gate
        run: uv run pytest -q --cov=sensorforge.isp --cov=sensorforge.metrics --cov-fail-under=80
